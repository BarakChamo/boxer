name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  # The mechanical half of the release gate in docs/release.md. The other half — smoke, the
  # evaluation tiers, and a clean-machine install — needs a real microVM and real credentials,
  # so a human runs it before tagging and records the result in the release notes.
  gate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Formatting, vet, tidy, race, coverage floor
        run: |
          unformatted=$(gofmt -l cmd internal pkg)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          go vet ./...
          go mod tidy -diff
          go test -race -coverprofile=coverage.out -covermode=atomic ./...
          ./scripts/coverfloor.sh coverage.out
      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: Every rendered view is valid JSON
        run: |
          go run ./cmd/boxer package all --out /tmp/d
          python3 - <<'PY'
          import json, pathlib, sys
          files = list(pathlib.Path('/tmp/d').rglob('*.json'))
          for f in files:
              json.loads(f.read_text())
          print(f'{len(files)} JSON files valid')
          sys.exit(0 if files else 1)
          PY
      - name: install.sh and the npm package against a staged release
        run: ./scripts/install-routes.sh
      - name: The npm package declares a license and ships its launcher
        run: |
          node -e '
            const p = require("./npm/package.json");
            const fs = require("fs");
            if (!p.license) throw new Error("npm package declares no license");
            if (!fs.existsSync("npm/" + p.bin.boxer)) throw new Error("npm bin is missing");
          '

  goreleaser:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless cosign signing: the OIDC token is the release's identity.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # Every pin below was verified against its upstream tag on 2026-09-18.
      - uses: anchore/sbom-action/download-syft@e11c554f704a0b820cbf8c51673f6945e0731532 # v0.20.0
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Attach the npm tarball (publishing stays manual)
        run: |
          cd npm
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version
          npm pack
          tar -tzf boxer-cli-*.tgz | grep -q 'package/bin/boxer.js'
          gh release upload "$GITHUB_REF_NAME" boxer-cli-*.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: The published release installs with install.sh
        run: |
          BOXER_VERSION="$GITHUB_REF_NAME" BOXER_INSTALL_DIR="$RUNNER_TEMP/bin" sh ./install.sh
          "$RUNNER_TEMP/bin/boxer" --version
