name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd internal pkg)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: Dependencies are tidy
        run: go mod tidy -diff
      - name: Tests with the race detector and coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Coverage floor
        run: ./scripts/coverfloor.sh coverage.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
      - name: Known vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  package:
    name: package, skill and plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Render every view and validate its JSON
        run: |
          go run ./cmd/boxer package all --out /tmp/d
          python3 - <<'PY'
          import json, pathlib, sys
          files = list(pathlib.Path('/tmp/d').rglob('*.json'))
          for f in files:
              json.loads(f.read_text())
          print(f'{len(files)} JSON files valid')
          sys.exit(0 if files else 1)
          PY
      - name: The checked-in skill and plugin match the templates
        run: |
          go run ./cmd/boxer package plugin --out /tmp/checked
          diff -r /tmp/checked/boxer plugin || {
            echo "plugin/ is stale; run 'make package' and commit the result"; exit 1; }
      - name: Agent Skills conformance
        run: |
          npx --yes @agentskills/skills-ref validate ./plugin/skills/boxer || \
            echo "skills-ref unavailable or failed; the Go schema test is authoritative"
      - name: goreleaser config check
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          version: "~> v2"
          args: check

  install-routes:
    name: install routes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # Pin added without network access to verify it against upstream; confirm the SHA.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: install.sh and the npm package against a staged release
        run: ./scripts/install-routes.sh
