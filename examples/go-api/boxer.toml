# A Go HTTP service. Runnable as it is: `boxer up`, then `curl "$(boxer url)"`.

image = "mirror.gcr.io/library/golang:1.24-alpine"

# No dependencies to fetch here. With some, add `go mod download` to setup and
# "proxy.golang.org", "sum.golang.org" to allow_hosts.
start = ["go run ."]
ready = "wget -q -O /dev/null http://127.0.0.1:8080/"
ready_timeout = "120s"

[network]
mode = "allowlist"
ports = ["auto:8080"]

[urls]
enabled = true

[tasks.test]
cmd = "go test ./..."
description = "the Go tests"

[tasks.vet]
cmd = "go vet ./..."
description = "static checks"
