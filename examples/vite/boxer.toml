# A Vite dev server per worktree. Runnable as it is: `boxer up`, then `boxer url`.

image = "mirror.gcr.io/library/node:24-alpine"
setup = ["npm install --no-audit --no-fund"]          # no lockfile here; use `npm ci` when you have one

# --host 0.0.0.0 so the forwarded port reaches it; --strictPort so a busy port is an error rather
# than Vite quietly moving to 5174, where the forward is not.
start = ["npx vite --host 0.0.0.0 --port 5173 --strictPort"]
ready = "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""
ready_timeout = "120s"

[network]
mode = "allowlist"
allow_hosts = ["registry.npmjs.org"]
ports = ["auto:5173"]

# Vite allows hosts under .localhost by default, so portless names need no server.allowedHosts.
[urls]
enabled = true
