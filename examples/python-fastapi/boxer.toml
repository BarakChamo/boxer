# A FastAPI service with uv. Runnable as it is: `boxer up`, then `curl "$(boxer url)"`.

image = "mirror.gcr.io/library/python:3.12-slim"

# The image has no uv. Installing it changes the image, not the worktree, so it is image_setup:
# run once and kept in the environment pack, so the next worktree does not install it again.
image_setup = ["pip install --no-cache-dir uv"]

# The virtualenv lands in the worktree (.venv), once per worktree. The host's uv cache is mounted
# read-only when uv.lock is present, so a re-sync mostly skips the download.
setup = ["uv sync"]

start = ["uv run uvicorn main:app --host 0.0.0.0 --port 8000"]
ready = "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/').status == 200 else 1)\""
ready_timeout = "120s"

[network]
mode = "allowlist"
allow_hosts = ["pypi.org", "files.pythonhosted.org"]
ports = ["auto:8000"]

[urls]
enabled = true

[tasks.test]
cmd = "uv run python -c \"import main; print('ok')\""
description = "import the app; replace with pytest once there are tests"
