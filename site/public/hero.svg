<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Three coding agents in three git worktrees, each running in its own boxer sandbox with its own dev server URL</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b93a1"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="400" rx="20" fill="#0f1117"/>

  <text x="40" y="52" fill="#8b93a1" font-size="14" letter-spacing="1.5">YOUR AGENTS, IN PARALLEL</text>
  <text x="560" y="52" fill="#8b93a1" font-size="14" letter-spacing="1.5">ONE SANDBOX EACH · MICROVM OR CONTAINER</text>

  <g>
    <rect x="40" y="78" width="330" height="84" rx="12" fill="#1a1d27" stroke="#2b3040"/>
    <text x="62" y="112" fill="#f4f5f7" font-size="18" font-weight="600">Claude Code</text>
    <text x="62" y="140" fill="#8b93a1" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worktree fix-ui · npm test</text>

    <rect x="40" y="180" width="330" height="84" rx="12" fill="#1a1d27" stroke="#2b3040"/>
    <text x="62" y="214" fill="#f4f5f7" font-size="18" font-weight="600">Codex</text>
    <text x="62" y="242" fill="#8b93a1" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worktree add-auth · npm run dev</text>

    <rect x="40" y="282" width="330" height="84" rx="12" fill="#1a1d27" stroke="#2b3040"/>
    <text x="62" y="316" fill="#f4f5f7" font-size="18" font-weight="600">Conductor task</text>
    <text x="62" y="344" fill="#8b93a1" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">worktree bump-deps · npm ci</text>
  </g>

  <g stroke="#8b93a1" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 380 120 L 548 120"/>
    <path d="M 380 222 L 548 222"/>
    <path d="M 380 324 L 548 324"/>
  </g>
  <text x="464" y="108" fill="#8b93a1" font-size="13" text-anchor="middle">boxer hook</text>

  <g>
    <rect x="560" y="78" width="360" height="84" rx="12" fill="#10251c" stroke="#1f6f4a"/>
    <text x="582" y="112" fill="#e6f6ee" font-size="18" font-weight="600">own sandbox · own dev server</text>
    <text x="582" y="140" fill="#6fd3a0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">https://fix-ui.myapp.localhost</text>

    <rect x="560" y="180" width="360" height="84" rx="12" fill="#10251c" stroke="#1f6f4a"/>
    <text x="582" y="214" fill="#e6f6ee" font-size="18" font-weight="600">own sandbox · own dev server</text>
    <text x="582" y="242" fill="#6fd3a0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">https://add-auth.myapp.localhost</text>

    <rect x="560" y="282" width="360" height="84" rx="12" fill="#10251c" stroke="#1f6f4a"/>
    <text x="582" y="316" fill="#e6f6ee" font-size="18" font-weight="600">own sandbox · own dev server</text>
    <text x="582" y="344" fill="#6fd3a0" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">https://bump-deps.myapp.localhost</text>
  </g>
</svg>
