# goreleaser v2. Tag v0.x.y, push, and the release workflow runs `goreleaser release --clean`.
version: 2
project_name: boxer

before:
  hooks:
    - go mod tidy
    # Plugins carry the version they were rendered from, so the renderer is built with it stamped.
    # They land in build/, not dist/: goreleaser requires dist/ to be empty after the hooks run.
    - sh -c 'rm -rf build && go run -ldflags "-X main.Version={{ .Version }}" ./cmd/boxer package all --out build/plugins && tar -czf build/boxer-plugins-{{ .Version }}.tar.gz -C build/plugins .'

builds:
  - id: boxer
    main: ./cmd/boxer
    binary: boxer
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: "boxer_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: BarakChamo
    name: boxer
  extra_files:
    - glob: build/boxer-plugins-*.tar.gz

changelog:
  use: git
  filters:
    exclude:
      - "^docs:"
      - "^test:"
